<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Biblioteca · Cadastro e empréstimos</title>
        <link rel="stylesheet" href="/css/style.css">
    </head>
<body>
    <header>
        <h1>Biblioteca · Cadastro e empréstimos</h1>
    </header>

    <nav aria-label="Navegação principal">
        <button type="button">Usuários</button>
        <button type="button">Livros e exemplares</button>
        <button type="button">Empréstimos</button>
        <button type="button">Multas e pagamentos</button>
    </nav>

    <main>
        <h2>Bem-vindo</h2>
        <p>Escolha uma seção para começar.</p>
        <section id="secao-usuarios" hidden>
            <h3>Cadastrar usuário</h3>
            <p id="mensagem-form" role="status" aria-live="polite" hidden></p>

            <form id="form-usuario">
                <label for="nome">Nome</label>
                <input id="nome" name="nome" type="text" required>

                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" required>

                <label for="cpf">CPF (11 dígitos)</label>
                <input
                        id="cpf"
                        name="cpf"
                        type="text"
                        maxlength="11"
                        pattern="[0-9]{11}"
                        required
                >

                <button type="submit">Cadastrar</button>
            </form>

            <h3>Usuários cadastrados</h3>
            <ul id="lista-usuarios"></ul>

            <h3>Usuários inativos</h3>
            <button id="botao-inativos" type="button">Ver usuários inativos</button>
            <ul id="lista-inativos" hidden></ul>

            <h3>Editar usuário</h3>
            <form id="form-editar-usuario" hidden>
                <input id="editar-id" type="hidden">

                <label for="editar-nome">Nome</label>
                <input id="editar-nome" type="text" required>

                <label for="editar-email">E-mail</label>
                <input id="editar-email" type="email" required>

                <label for="editar-cpf">CPF (11 dígitos)</label>
                <input
                        id="editar-cpf"
                        type="text"
                        maxlength="11"
                        pattern="[0-9]{11}"
                        required
                >

                <button type="submit">Salvar alterações</button>
                <button id="cancelar-edicao" type="button">Cancelar</button>
            </form>
        </section>
    </main>

<script src="/js/app.js" type="module"></script>
</body>
</html>
